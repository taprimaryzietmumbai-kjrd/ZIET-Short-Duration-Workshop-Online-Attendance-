<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b2850">
<title>ZIET Mumbai | Workshop Online Attendance</title>
<style>
:root{color-scheme:light;--navy:#0b2850;--gold:#f0a52b;--bg:#f3f6fb;--ink:#1e293b;--muted:#64748b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font:16px/1.5 "Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{padding:16px 12px;text-align:center;color:#fff;background:linear-gradient(130deg,#0b2850,#123b6d);border-bottom:4px solid var(--gold)}
header .org{font-size:.9rem;letter-spacing:.04em;font-weight:700}
header h1{font-size:clamp(1.35rem,3vw,2rem);margin:4px 0}
header p{margin:0;color:#e6eef8}
main{width:min(1100px,100%);margin:0 auto;padding:12px}
.status{margin:0 0 10px;padding:10px 13px;border-radius:8px;background:#eaf3ff;color:#17477e;font-size:.92rem}
.frame-wrap{background:#fff;border:1px solid #dbe3ef;border-radius:12px;overflow:hidden;box-shadow:0 6px 22px #123b6d0d}
iframe{display:block;width:100%;height:calc(100vh - 190px);min-height:760px;border:0;background:#f3f6fb}
.fallback{padding:16px;text-align:center;color:var(--muted);font-size:.92rem}
.fallback a{color:#123b6d;font-weight:700}
footer{text-align:center;padding:8px 12px 18px;color:var(--muted);font-size:.85rem}
@media(max-width:600px){main{padding:8px}.status{font-size:.86rem}iframe{height:calc(100vh - 170px);min-height:900px}}
</style>
</head>
<body>
<header>
  <div class="org">KENDRIYA VIDYALAYA SANGATHAN</div>
  <h1>Workshop Online Attendance</h1>
  <p>Zonal Institute of Education &amp; Training, Mumbai</p>
</header>
<main>
  <p class="status" id="status">Connecting to the secure attendance application…</p>
  <div class="frame-wrap">
    <iframe
      id="attendanceApp"
      title="ZIET Mumbai Workshop Online Attendance"
      src="https://script.google.com/macros/s/AKfycbz0vgXCWrCAvJX_YaZ4tk7atjS7j9VQPVHfKKy4fuVs1DWuSW3los4E9TyG2L0pHif-/exec"
      loading="eager"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>
  <div class="fallback">If the attendance form does not appear, <a href="https://script.google.com/macros/s/AKfycbz0vgXCWrCAvJX_YaZ4tk7atjS7j9VQPVHfKKy4fuVs1DWuSW3los4E9TyG2L0pHif-/exec" target="_blank" rel="noopener noreferrer">open the attendance application directly</a>.</div>
</main>
<footer>KVS · ZIET Mumbai · Workshop Attendance</footer>
<script>
const frame=document.getElementById('attendanceApp');
const status=document.getElementById('status');
frame.addEventListener('load',()=>{status.textContent='Attendance application loaded. Select your participant list and name below.';status.style.background='#e1f5e9';status.style.color='#116b41';});
</script>
</body>
</html>
